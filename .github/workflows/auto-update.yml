name: Sri Lanka index verification and refresh

'on':
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify AnantPlay sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/verify_release.py
      - name: Run complete read-only URL sweep on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          result=0
          python scripts/update_index.py --dry-run >"$report" 2>&1 || result=$?
          cat "$report"
          if (( result != 0 )); then
            error=$(tail -n 45 "$report")
            error=${error//%/%25}
            error=${error//$'\r'/%0D}
            error=${error//$'\n'/%0A}
            echo "::error title=URL sweep failed::$error"
            exit "$result"
          fi
          summary=$(sed '/^## All probe results/,$d' "$report")
          summary=${summary//%/%25}
          summary=${summary//$'\n'/%0A}
          echo "::notice title=URL sweep::$summary"
          while IFS= read -r missing; do
            echo "::notice title=Missing URL observation::${missing//%/%25}"
          done < <(sed '/^## All probe results/,$!d; /^--- a\//,$d' "$report" | grep -E ' \| (missing|dns-not-found|non-hls) \|' || true)
          sed '/^--- a\//,$d' "$report" >> "$GITHUB_STEP_SUMMARY"

  update:
    name: Refresh the index on main
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: refresh-sri-lanka-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/update_index.py
      - run: python scripts/verify_release.py
      - name: Commit only changed generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(index.json sources.txt srilanka_category.m3u srilanka_language.m3u srilanka_sites.json STATUS.md)
          if [[ -z $(git status --porcelain -- "${files[@]}") ]]; then
            echo 'No generated files changed.'
            exit 0
          fi
          git add -- "${files[@]}"
          git commit -m 'chore: refresh Sri Lanka source health'
          # Refuses non-fast-forward pushes; a newer main is never overwritten.
          git push origin HEAD:refs/heads/main
